<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArcPay Agent: send USDC by chatting</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EEEB;--ink:#12302F;--mute:#5B7270;--card:#fff;--acc:#2D2BE0;--ok:#0E7A4F;
font-family:"Familjen Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:12px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
#conn{background:var(--ink);color:#fff;padding:9px 14px;font-weight:600;font-size:14px}
#conn.on{background:transparent;color:var(--ok);border:1.5px solid var(--ok)}
#log{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;line-height:1.4;font-size:15px;white-space:pre-wrap;word-break:break-word}
.a{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m a{color:var(--acc)}
.slip{align-self:flex-start;width:86%;background:var(--card);border-radius:6px;padding:14px;
border-top:3px dashed var(--acc);border-bottom:3px dashed var(--acc)}
.slip .amt{font-size:34px;font-weight:700;letter-spacing:-.02em}
.slip .to{color:var(--mute);font-size:13px;word-break:break-all;margin:2px 0 12px}
.slip .row{display:flex;gap:8px}
.slip button{flex:1;padding:11px;font-weight:600;font-size:15px}
.go{background:var(--acc);color:#fff}.no{background:#E3E9E7;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px}
.chips button{flex:none;background:var(--card);color:var(--ink);padding:7px 12px;font-size:13px;border:1px solid #C9D6D2}
form{display:flex;gap:8px;padding:8px 16px 14px}
input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid #C9D6D2;border-radius:12px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
form button{background:var(--acc);color:#fff;padding:0 18px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.m,.slip{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
  <h1>ArcPay Agent<small>Send USDC on Arc by chatting</small></h1>
  <button id="conn">Connect wallet</button>
</header>
<main id="log" aria-live="polite"></main>
<div class="chips" id="chips"></div>
<form id="f" autocomplete="off">
  <input id="in" placeholder="pay ada 5" enterkeyhint="send" aria-label="Message the agent">
  <button>Send</button>
</form>

<script type="module">
import { createPublicClient, createWalletClient, custom, http, defineChain, parseUnits, formatUnits, isAddress, getAddress }
  from "https://esm.sh/viem@2.21.54";

const arc = defineChain({
  id: 5042, name: "Arc",
  nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
  rpcUrls: { default: { http: ["https://rpc.mainnet.arc.io"] } },
  blockExplorers: { default: { name: "ArcScan", url: "https://arcscan.app" } }
});
const USDC = "0x3600000000000000000000000000000000000000"; // ERC-20 interface, 6 decimals
const abi = [
  { name: "balanceOf", type: "function", stateMutability: "view", inputs: [{ name: "a", type: "address" }], outputs: [{ type: "uint256" }] },
  { name: "transfer", type: "function", stateMutability: "nonpayable", inputs: [{ name: "to", type: "address" }, { name: "v", type: "uint256" }], outputs: [{ type: "bool" }] }
];
const pub = createPublicClient({ chain: arc, transport: http() });
const $ = s => document.querySelector(s);
const log = $("#log");
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let contacts = store.get("contacts", {}), limit = store.get("limit", 50), history = store.get("history", []);
let wallet, account;

function say(text, who = "a") {
  const d = document.createElement("div"); d.className = "m " + who; d.textContent = text;
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}
function sayLink(text, hash) {
  const d = say(text + " "); const a = document.createElement("a");
  a.href = arc.blockExplorers.default.url + "/tx/" + hash; a.target = "_blank"; a.rel = "noopener"; a.textContent = "View transaction";
  d.append(a);
}
const short = a => a.slice(0, 6) + "…" + a.slice(-4);

async function connect() {
  if (!window.ethereum) { say("No wallet found. Open this page inside your wallet app's browser (MetaMask, Trust, Coinbase Wallet)."); return false }
  try {
    const [a] = await window.ethereum.request({ method: "eth_requestAccounts" });
    const chainId = "0x" + arc.id.toString(16);
    try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId }] }) }
    catch { await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId, chainName: "Arc", nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 }, rpcUrls: ["https://rpc.mainnet.arc.io"], blockExplorerUrls: [arc.blockExplorers.default.url] }] }) }
    account = getAddress(a);
    wallet = createWalletClient({ account, chain: arc, transport: custom(window.ethereum) });
    $("#conn").textContent = short(account); $("#conn").classList.add("on");
    say("Connected as " + short(account) + " on Arc. Say \"balance\" or \"pay ada 5\".");
    return true;
  } catch (e) { say("Wallet connection was cancelled. Tap Connect wallet to try again."); return false }
}
async function needWallet() { return account ? true : await connect() }

function parse(t) {
  const l = t.toLowerCase().trim(); let m;
  if (/^(help|\?|hi|hello|hey)\b/.test(l)) return { k: "help" };
  if (/balance|how much/.test(l)) return { k: "balance" };
  if (/^(contacts|address book)/.test(l)) return { k: "contacts" };
  if (/^history/.test(l)) return { k: "history" };
  if ((m = l.match(/^limit\s+\$?(\d+(?:\.\d+)?)/))) return { k: "limit", v: +m[1] };
  if ((m = t.trim().match(/^(?:save|add)\s+([\w.-]+)\s+(0x[0-9a-fA-F]{40})$/))) return { k: "save", name: m[1].toLowerCase(), addr: m[2] };
  let who, amt;
  if ((m = t.trim().match(/^(?:pay|send|transfer)\s+\$?(\d+(?:\.\d+)?)\s*(?:usdc|usd)?\s+(?:to\s+)?(\S+)$/i))) { amt = m[1]; who = m[2] }
  else if ((m = t.trim().match(/^(?:pay|send|transfer)\s+(?:to\s+)?(\S+)\s+\$?(\d+(?:\.\d+)?)\s*(?:usdc|usd)?$/i))) { who = m[1]; amt = m[2] }
  if (who) return { k: "pay", who, amt };
  return { k: "unknown" };
}

async function run(t) {
  const c = parse(t);
  if (c.k === "help") return say("I can:\n• pay ada 5  (or send 5 USDC to 0x…)\n• save ada 0x…  (add a contact)\n• balance, contacts, history\n• limit 25  (max per payment)\n\nI always ask you to confirm before anything is sent.");
  if (c.k === "save") { contacts[c.name] = getAddress(c.addr); store.set("contacts", contacts); return say("Saved " + c.name + " → " + short(contacts[c.name])) }
  if (c.k === "contacts") { const e = Object.entries(contacts); return say(e.length ? e.map(([n, a]) => n + ": " + short(a)).join("\n") : "No contacts yet. Try: save ada 0x…") }
  if (c.k === "limit") { limit = c.v; store.set("limit", limit); return say("Limit set: I won't prepare payments above " + limit + " USDC.") }
  if (c.k === "history") return say(history.length ? history.slice(-5).reverse().map(h => h.amt + " USDC → " + short(h.to)).join("\n") : "No payments from this device yet.");
  if (c.k === "balance") {
    if (!await needWallet()) return;
    const b = await pub.readContract({ address: USDC, abi, functionName: "balanceOf", args: [account] });
    return say("Your balance: " + formatUnits(b, 6) + " USDC");
  }
  if (c.k === "pay") {
    if (!await needWallet()) return;
    const amt = +c.amt;
    if (!(amt > 0)) return say("The amount must be more than 0.");
    if (amt > limit) return say("That's above your " + limit + " USDC limit. Say \"limit " + Math.ceil(amt) + "\" first if you really want this.");
    const to = isAddress(c.who) ? getAddress(c.who) : contacts[c.who.toLowerCase()];
    if (!to) return say("I don't know \"" + c.who + "\". Say: save " + c.who.toLowerCase() + " 0x… (their address)");
    const bal = await pub.readContract({ address: USDC, abi, functionName: "balanceOf", args: [account] });
    if (bal < parseUnits(c.amt, 6)) return say("Not enough USDC. You have " + formatUnits(bal, 6) + ".");
    return slip(c.amt, c.who, to);
  }
  say("I didn't catch that. Try \"pay ada 5\" or say \"help\".");
}

function slip(amt, label, to) {
  const s = document.createElement("div"); s.className = "slip";
  s.innerHTML = '<div class="amt"></div><div class="to"></div><div class="row"><button class="no">Cancel</button><button class="go">Confirm & send</button></div>';
  s.querySelector(".amt").textContent = amt + " USDC";
  s.querySelector(".to").textContent = "to " + label + " (" + to + ")";
  const done = () => s.querySelector(".row").remove();
  s.querySelector(".no").onclick = () => { done(); say("Cancelled. Nothing was sent.") };
  s.querySelector(".go").onclick = async () => {
    done(); const w = say("Waiting for your wallet to approve…");
    try {
      const hash = await wallet.writeContract({ address: USDC, abi, functionName: "transfer", args: [to, parseUnits(amt, 6)], account });
      w.textContent = "Sent. Confirming on Arc…";
      const r = await pub.waitForTransactionReceipt({ hash });
      if (r.status === "success") { history.push({ to, amt, hash }); store.set("history", history); sayLink("Done. " + amt + " USDC sent to " + label + ".", hash) }
      else sayLink("The transaction failed on-chain.", hash);
    } catch (e) { w.textContent = "Not sent: " + (e.shortMessage || e.message || "rejected in wallet") }
  };
  log.append(s); log.scrollTop = log.scrollHeight;
}

$("#conn").onclick = connect;
$("#f").onsubmit = async e => {
  e.preventDefault(); const v = $("#in").value.trim(); if (!v) return;
  $("#in").value = ""; say(v, "u");
  try { await run(v) } catch (err) { say("Something went wrong: " + (err.shortMessage || err.message)) }
};
["balance", "pay ada 5", "contacts", "help"].forEach(t => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = t;
  b.onclick = () => { $("#in").value = t; $("#in").focus() }; $("#chips").append(b);
});
say("Hi, I'm ArcPay. Tell me who to pay and how much, and I'll set it up for you to approve. Connect your wallet to start.");
</script>
</body>
  </html>
